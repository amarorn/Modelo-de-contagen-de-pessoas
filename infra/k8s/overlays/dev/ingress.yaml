apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: visioncount
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: dev.visioncount.local
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: visioncount
spec:
  parentRefs:
    - name: visioncount
  hostnames:
    - dev.visioncount.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: visioncount-backend
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: visioncount-frontend
          port: 80
