apiVersion: apps/v1
kind: Deployment
metadata:
  name: visioncount-frontend
  labels:
    app.kubernetes.io/name: visioncount-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: visioncount-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: visioncount-frontend
    spec:
      serviceAccountName: visioncount-frontend
      containers:
        - name: frontend
          image: ghcr.io/amarorn/visioncount-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
