apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visioncount-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visioncount-allow-frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: visioncount-frontend
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visioncount-allow-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: visioncount-backend
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visioncount-allow-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: visioncount-backend
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
