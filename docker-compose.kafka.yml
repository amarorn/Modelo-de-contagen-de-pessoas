# Stack local opcional: Redpanda (API Kafka) + PostgreSQL.
#
# Subir:
#   docker compose -f docker-compose.kafka.yml up -d
#
# No .env do projeto (na raiz, ao lado deste ficheiro), o Docker Compose usa
# POSTGRES_* para o contentor. Exemplo mínimo para a app no host:
#
#   KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9092
#   DATABASE_URL=postgresql+psycopg2://contagem:contagem@127.0.0.1:5433/contagem
#
# Porta 5433 no host por defeito (evita conflito com outro Postgres na 5432).
# Para mapear outra porta: POSTGRES_PORT=55432 no .env e use essa porta na DATABASE_URL.
#
# Credenciais por defeito (desenvolvimento): user/pass/db = contagem.
# Para produção: defina POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB no .env e
# ajuste DATABASE_URL em conformidade.
#
# Requisitos Python: pip install -r requirements.txt (inclui psycopg2-binary).

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.11
    container_name: contagem-redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://127.0.0.1:9092
    ports:
      - "9092:9092"

  postgres:
    image: postgres:16-alpine
    container_name: contagem-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contagem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contagem}
      POSTGRES_DB: ${POSTGRES_DB:-contagem}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - contagem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  contagem_pgdata:
