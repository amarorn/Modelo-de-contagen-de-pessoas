# ByteTrack com track_buffer curto: overlays desaparecem mais depressa em live/HLS.
# Uso: --tracker configs/bytetrack_live.yaml
# Base: ultralytics/cfg/trackers/bytetrack.yaml

tracker_type: bytetrack
# Limiares reduzidos para nao descartar deteccoes de pessoas distantes/oclusas
# antes de virarem track (antes: 0.22 / 0.08 / 0.22, muitas sumiam no stream HLS).
track_high_thresh: 0.12
track_low_thresh: 0.05
new_track_thresh: 0.12
# Buffer maior: preserva ID quando a pessoa some por alguns frames atras de outra.
track_buffer: 30
match_thresh: 0.80
fuse_score: true
