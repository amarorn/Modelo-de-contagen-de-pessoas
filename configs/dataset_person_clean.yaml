# Dataset local cached pelo Ultralytics HUB durante o exp-31-4.
# nc=25 e obrigatorio: os .txt do dataset tem class_ids ate 24 (raros: 7, 9, 24).
# Se nc<25, o trainer crasha com "index out of bounds" no IndexKernel CUDA.
#
# Uso recomendado para contagem de pessoas:
#   YOLO_CLASSES=0                          -> so Pessoa (recomendado, treino rapido)
#   YOLO_CLASSES=0,1,2,3,4,5,6              -> Pessoa + veiculos (ignora class7..24)
# Sem YOLO_CLASSES treina todas 25 classes (mau: class7..24 estao quase vazias).

path: /home/amaro-neto/datasets/person-5170a94e
train: images/train
val: images/val
test: images/test

nc: 25
