# ByteTrack com buffer maior para oclusoes curtas / deteccao instavel.
# Uso: src/web_dashboard.py --tracker configs/bytetrack_stable.yaml
# Base: ultralytics/cfg/trackers/bytetrack.yaml

tracker_type: bytetrack
track_high_thresh: 0.15
track_low_thresh: 0.08
new_track_thresh: 0.20
track_buffer: 30
match_thresh: 0.85
fuse_score: true
